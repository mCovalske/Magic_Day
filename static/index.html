<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бот предсказаний</title><style>body{font-family:Arial;background:#20203a;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(520px,90%);padding:28px;border-radius:24px;background:#ffffff18}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:12px;border:0;font-size:16px}button{font-weight:700}.result{white-space:pre-wrap;margin-top:12px;padding:14px;background:#0003;border-radius:12px}</style></head><body><div class="card"><h1>🔮 Бот предсказаний</h1><input id="date" placeholder="ДД.ММ.ГГГГ"><select id="sphere"><option value="general">Общий прогноз</option><option value="love">❤️ Любовь</option><option value="career">💼 Карьера</option><option value="finance">💰 Финансы</option><option value="family">👨‍👩‍👧 Семья</option><option value="health">🌿 Самочувствие</option><option value="growth">📚 Развитие</option></select><button onclick="go()">Получить прогноз</button><div id="r" class="result"></div></div><script>async function go(){const d=document.getElementById('date').value.trim(),s=document.getElementById('sphere').value,r=document.getElementById('r');r.textContent='🔮 Готовлю прогноз...';try{const x=await fetch('/api/personal?birthdate='+encodeURIComponent(d)+'&sphere='+encodeURIComponent(s));const j=await x.json();if(!x.ok)throw new Error(j.message||'Ошибка');r.textContent=j.prediction||'Нет результата'}catch(e){r.textContent='Ошибка: '+e.message}}</script></body></html>
